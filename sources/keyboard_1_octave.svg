        <dc:title>Standard 88-key Piano Keyboard</dc:title>
        <dc:date>2011-02-14T04:42:21</dc:date>
        <dc:description>Standard 88-key piano keyboard. Distance between octaves is approximately 165 mm, per http://en.wikipedia.org/wiki/Musical_keyboard. Relative key dimensions similar to some commercial electric pianos.</dc:description>
